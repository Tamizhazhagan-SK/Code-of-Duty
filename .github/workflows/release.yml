name: release
# Tag-triggered release: v1.2.3 -> build, verify, publish a GitHub Release with
# the sdist/wheel and the bootstrap installers attached. Reruns the same
# checks CI already did on the tag's commit as a final gate before publishing.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-binaries:
    # Single-file PyInstaller binaries so a laptop with no Python can still run zerotrace
    # (docs/DEPLOYMENT.md "No Python on laptops"). One per OS; architecture is whatever the
    # runner's default is (e.g. macos-latest is arm64).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }

      - run: python -m pip install --upgrade pip && pip install -e ".[dev]" pyinstaller

      - run: pyinstaller zerotrace.spec

      - name: Binary must run with no other install step
        shell: bash
        run: |
          set -euo pipefail
          bin=dist/zerotrace
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --help
          "$bin" doctor || true   # doctor may WARN/FAIL on a bare CI runner; it must not crash

      - name: Name the artifact for this OS/arch
        shell: bash
        run: |
          set -euo pipefail
          src=dist/zerotrace
          ext=""
          [ -f "$src.exe" ] && { src="$src.exe"; ext=".exe"; }
          mkdir -p out
          cp "$src" "out/zerotrace-${{ runner.os }}-${{ runner.arch }}$ext"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zerotrace-${{ runner.os }}-${{ runner.arch }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: binaries
          merge-multiple: true

      - name: Tag must match pyproject.toml version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $pkg"
            exit 1
          fi

      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: pytest -q

      - name: Build sdist and wheel
        run: pip install build && python -m build

      - name: Wheel must carry the rule pack and eval cases
        run: |
          python - <<'PY'
          import glob
          import zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for needed in ("zerotrace/detectors/rules/default.yml",
                         "zerotrace/evals/classifier_cases.jsonl"):
              assert needed in names, needed
          print("wheel contents ok")
          PY

      - name: Extract this version's changelog section
        run: |
          python - <<'PY'
          import pathlib
          import re

          tag = "${{ github.ref_name }}".lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^## \[{re.escape(tag)}\].*?(?=^## \[|\Z)"
          match = re.search(pattern, text, re.MULTILINE | re.DOTALL)
          notes = match.group(0).strip() if match else f"Release {tag}"
          pathlib.Path("release_notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* install.sh install.ps1 binaries/* \
            --title "ZeroTrace $GITHUB_REF_NAME" \
            --notes-file release_notes.md
