[project]
name = "zerotrace"
version = "0.2.0"
description = "Local-first pre-commit secret & PII guardrail for every repo on the machine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "detect-secrets>=1.5",
  "rich>=13",
  "pyyaml>=6",
]
[project.optional-dependencies]
# NER-based PII (Presidio + spaCy). Heavy, so opt-in: `policy.pii.engine: presidio`.
pii-ner = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
llm = []                        # kept for back-compat; the model client is stdlib-only now
dev = ["pytest", "mypy", "ruff", "pre-commit", "types-PyYAML"]

[project.scripts]
zerotrace = "zerotrace.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zerotrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "SIM"]
ignore = ["SIM108"]

[tool.mypy]
ignore_missing_imports = true
