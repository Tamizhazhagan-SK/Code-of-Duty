name: secret-scan (defense in depth)
on: [push, pull_request]
jobs:
  zerotrace:
    # Same engine as the laptop hook, deterministic only: catches --no-verify and unprotected machines.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install .
      - name: Scan the commits in this push / PR
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            zerotrace scan --all --no-model
          else
            zerotrace scan --range "$BASE..${{ github.sha }}" --no-model
          fi
  gitleaks:
    # A second, independent engine (ADR 0001).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
