[project]
name = "zerotrace"
version = "0.1.0"
description = "Local-first pre-commit secret & PII guardrail for every repo on the machine"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Tamizhazhagan S" }]
keywords = ["git", "pre-commit", "secrets-detection", "pii", "security", "hooks"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = [
  "detect-secrets>=1.5",
  "rich>=13",
  "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/Tamizhazhagan-SK/Code-of-Duty"
Repository = "https://github.com/Tamizhazhagan-SK/Code-of-Duty"
Issues = "https://github.com/Tamizhazhagan-SK/Code-of-Duty/issues"
Changelog = "https://github.com/Tamizhazhagan-SK/Code-of-Duty/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# NER-based PII (Presidio + spaCy). Heavy, so opt-in: `policy.pii.engine: presidio`.
pii-ner = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
llm = []                        # kept for back-compat; the model client is stdlib-only now
dev = ["pytest", "pytest-cov", "mypy", "ruff", "pre-commit", "types-PyYAML"]

[project.scripts]
zerotrace = "zerotrace.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zerotrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["zerotrace"]
omit = ["*/evals/*"]          # the eval harness needs a live model; measured by hand

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "SIM"]
ignore = ["SIM108"]

[tool.mypy]
ignore_missing_imports = true
