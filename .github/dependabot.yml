# Actions are pinned to commit SHAs (a tag can be moved to point at other code). Dependabot
# keeps those pins current and updates the trailing "# v4" comment with the new version.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
