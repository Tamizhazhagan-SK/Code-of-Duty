name: release
# Tag-triggered release: v1.2.3 -> build, verify, publish a GitHub Release with
# the sdist/wheel and the bootstrap installers attached. Reruns the same
# checks CI already did on the tag's commit as a final gate before publishing.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }

      - name: Tag must match pyproject.toml version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $pkg"
            exit 1
          fi

      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: pytest -q

      - name: Build sdist and wheel
        run: pip install build && python -m build

      - name: Wheel must carry the rule pack and eval cases
        run: |
          python - <<'PY'
          import glob
          import zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for needed in ("zerotrace/detectors/rules/default.yml",
                         "zerotrace/evals/classifier_cases.jsonl"):
              assert needed in names, needed
          print("wheel contents ok")
          PY

      - name: Extract this version's changelog section
        run: |
          python - <<'PY'
          import pathlib
          import re

          tag = "${{ github.ref_name }}".lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^## \[{re.escape(tag)}\].*?(?=^## \[|\Z)"
          match = re.search(pattern, text, re.MULTILINE | re.DOTALL)
          notes = match.group(0).strip() if match else f"Release {tag}"
          pathlib.Path("release_notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* install.sh install.ps1 \
            --title "ZeroTrace $GITHUB_REF_NAME" \
            --notes-file release_notes.md
