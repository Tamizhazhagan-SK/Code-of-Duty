# SonarQube Cloud configuration.
#
# Without this file every path is analysed as production source, so the intentionally fake
# credentials in the test suite and in the demo fixtures are reported as hard-coded secrets.
# They are deliberate: this project's tests need format-valid fake tokens, and the demo repos
# exist to be blocked on stage. Real values are never stored; both are generated at run time
# (tests/conftest.py::Fake and demo/render_fixtures.py).

# Automatic Analysis already knows the project, so the key/organization are only needed if we
# ever switch to the CI-based scanner. Copy the exact values from SonarQube Cloud >
# Information before uncommenting: a wrong key fails the analysis.
# sonar.projectKey=<from SonarQube Cloud>
# sonar.organization=<from SonarQube Cloud>

sonar.sources=src,demo/render_fixtures.py
sonar.tests=tests
sonar.python.version=3.11,3.12
sonar.sourceEncoding=UTF-8

# Template repos rendered into throwaway demo repos. They contain placeholder credentials
# ({{gen:...}}) on purpose and are never imported or executed by the package.
sonar.exclusions=demo/fixtures/**,docs/**,skill/**,.venv/**

# Detector rule material: long regexes and credential-shaped literals are the product here.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4
# "Hard-coded credentials" inside the detector rule pack and its prompts/fixtures.
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S6418
sonar.issue.ignore.multicriteria.e1.resourceKey=src/zerotrace/classifier/prompt.py
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.e2.resourceKey=src/zerotrace/detectors/**
# Detection regexes are intentionally broad; inputs are single diff lines capped at 4000 chars.
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S5852
sonar.issue.ignore.multicriteria.e3.resourceKey=src/zerotrace/detectors/**
sonar.issue.ignore.multicriteria.e4.ruleKey=python:S5852
sonar.issue.ignore.multicriteria.e4.resourceKey=src/zerotrace/classifier/redact.py
