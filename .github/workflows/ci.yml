name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check src tests demo
      - run: mypy src
      - run: pytest -q

  no-egress:
    # The promise is that detection never reaches the network. Prove it: the whole suite runs
    # with every non-loopback connect() blocked, and the build fails if anything tries.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: python ci/no_egress.py -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install build && python -m build
      - name: The wheel must carry the rule pack and eval cases
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for needed in ("zerotrace/detectors/rules/default.yml",
                         "zerotrace/evals/classifier_cases.jsonl"):
              assert needed in names, needed
          print("wheel contents ok")
          PY

  dogfood:
    # ZeroTrace must pass its own scanner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - run: zerotrace scan --all --no-model --fail-on warn
