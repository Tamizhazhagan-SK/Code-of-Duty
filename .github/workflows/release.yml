name: release
# Tags and publishes releases by itself. Three ways to start one:
#
#   1. The "Run workflow" button (Actions > release): pick patch, minor or major and, if you
#      like, a one-line summary. The workflow bumps the version everywhere, moves
#      [Unreleased] in CHANGELOG.md into the new section, commits "chore: prepare vX.Y.Z" to
#      main, then tags and releases it.
#   2. Push a commit to main that raises the version (`python scripts/release.py bump minor`,
#      then commit and push). That version has no tag yet, so it is tagged and released.
#   3. Push a vX.Y.Z tag by hand, as before.
#
# Whichever way, the release commit must pass the full test suite, the three binaries are
# built, the annotated tag is pushed, and one GitHub Release is published with that version's
# CHANGELOG section as its notes. A version that is already released is skipped, so an
# ordinary push or a re-run never publishes twice.
#
# It is one workflow rather than "tag, then a second workflow releases" because GitHub does not
# start workflows for tags or commits pushed with the built-in token: a chained release would
# silently never run.
on:
  push:
    branches: [main]
    paths: [pyproject.toml]       # only a version change can start a release (tags always run)
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch
      summary:
        description: One line for the release commit and tag (optional)
        type: string
        required: false

# Read-only by default. Only `bump` (pushes the release commit) and `release` (pushes the tag
# and publishes) get write access, so no build step can write to the repository.
permissions:
  contents: read

# One release at a time; a second run waits instead of racing the first for the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write             # pushes "chore: prepare vX.Y.Z" to main
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Releases are cut from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::run the release workflow on main, not $GITHUB_REF"
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }

      - name: Raise the version and cut the changelog section
        env:
          BUMP: ${{ inputs.bump }}
        run: python scripts/release.py bump "$BUMP"

      - name: Commit the release to main
        id: commit
        env:
          SUMMARY: ${{ inputs.summary }}
        run: |
          set -euo pipefail
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          message="chore: prepare v$version"
          if [ -n "$SUMMARY" ]; then message="$message - $SUMMARY"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --message "$message"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  plan:
    # Runs after `bump` when there is one, straight away otherwise.
    needs: bump
    if: ${{ !cancelled() && needs.bump.result != 'failure' }}
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.bump.outputs.sha || github.sha }}
          fetch-depth: 0          # every tag, to tell whether this version is released yet

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }

      - name: Is there a version to release?
        id: plan
        run: |
          set -euo pipefail
          python scripts/release.py plan >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-binaries:
    # Single-file PyInstaller binaries so a laptop with no Python can still run zerotrace
    # (docs/DEPLOYMENT.md "No Python on laptops"). One per OS; architecture is whatever the
    # runner's default is (e.g. macos-latest is arm64).
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }

      # Dependencies: exact, hash-checked wheels from the lock (scripts/lock_deps.py writes it),
      # so every file is known in advance and nothing runs setup code while it installs.
      # The project itself comes last, from this checkout: no index, no build isolation.
      - run: 'python -m pip install --require-hashes --only-binary :all: -r requirements/release.txt'
      - run: 'python -m pip install --no-deps --no-build-isolation --no-index --only-binary :all: -e .'

      - run: pyinstaller zerotrace.spec

      - name: Binary must run with no other install step
        shell: bash
        run: |
          set -euo pipefail
          bin=dist/zerotrace
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --help
          "$bin" doctor || true   # doctor may WARN/FAIL on a bare CI runner; it must not crash

      - name: Name the artifact for this OS/arch
        shell: bash
        run: |
          set -euo pipefail
          src=dist/zerotrace
          ext=""
          [ -f "$src.exe" ] && { src="$src.exe"; ext=".exe"; }
          mkdir -p out
          cp "$src" "out/zerotrace-${{ runner.os }}-${{ runner.arch }}$ext"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zerotrace-${{ runner.os }}-${{ runner.arch }}
          path: out/*
          if-no-files-found: error

  release:
    needs: [plan, build-binaries]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write             # pushes the annotated tag and publishes the release
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0          # the tags, and the commit subject for the tag message

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: binaries
          merge-multiple: true

      # Dependencies: exact, hash-checked wheels from the lock (scripts/lock_deps.py writes it),
      # so every file is known in advance and nothing runs setup code while it installs.
      # The project itself comes last, from this checkout: no index, no build isolation.
      - run: 'python -m pip install --require-hashes --only-binary :all: -r requirements/dev.txt'
      - run: 'python -m pip install --no-deps --no-build-isolation --no-index --only-binary :all: -e .'

      - name: The release commit must pass the whole suite
        run: pytest -q

      - name: Build sdist and wheel
        run: python -m build --no-isolation     # build + hatchling come from requirements/dev.txt

      - name: Wheel must carry the rule pack and eval cases
        run: |
          python - <<'PY'
          import glob
          import zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for needed in ("zerotrace/detectors/rules/default.yml",
                         "zerotrace/evals/classifier_cases.jsonl"):
              assert needed in names, needed
          print("wheel contents ok")
          PY

      - name: Release notes from the CHANGELOG
        run: python scripts/release.py notes "$TAG" > release_notes.md

      - name: Tag the release (annotated), unless the tag was pushed by hand
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists; not re-tagging"
          else
            message=$(python scripts/release.py tag-message "$TAG" "$SHA")
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$TAG" --message "$message" "$SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish the GitHub release (once)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::the $TAG release already exists; nothing to publish"
            exit 0
          fi
          gh release create "$TAG" dist/* install.sh install.ps1 binaries/* \
            --verify-tag --title "ZeroTrace $TAG" --notes-file release_notes.md
