# Config for developing THIS repo (dogfooding + hygiene).
repos:
  - repo: local
    hooks:
      - id: sentinel
        name: sentinel (self)
        entry: uv run sentinel run
        language: system
        pass_filenames: true
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks: [{id: end-of-file-fixer}, {id: trailing-whitespace}, {id: check-yaml}]
